[tox]
envlist = py311, py312, py313

[testenv]
extras = test
commands =
    pytest tests/ --cov --cov-report=term-missing -q --tb=short
    pytest --nbmake docs/source/tutorials -q
setenv =
    PYTHONPATH = {toxinidir}
    MPLBACKEND = Agg

[testenv:lint]
extras = dev
commands =
    ruff check qiskit_waveform_sim tests examples
    black --check qiskit_waveform_sim tests examples
    mypy qiskit_waveform_sim

[testenv:docs]
extras = docs
commands =
    sphinx-build -b html docs/source docs/_build/html -W --keep-going