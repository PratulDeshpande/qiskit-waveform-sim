[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-waveform-sim"
version = "0.1.5"
description = "Zero-bloat Classical Control Waveform Simulator and Interactive Pulse Sheet Viewer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Pratul Deshpande", email = "pratul.deshpande06@gmail.com"}
]
maintainers = [
    {name = "Pratul Deshpande", email = "pratul.deshpande06@gmail.com"}
]
keywords = [
    "qiskit",
    "quantum-computing",
    "waveform-simulation",
    "pulse-sheet",
    "quantum-control",
    "openqasm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.0.0,<3.0.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "plotly>=5.18",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
]
dev = [
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.5",
    "pre-commit>=3.5",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
export = [
    "kaleido>=0.2",
]

[project.urls]
Homepage = "https://github.com/PratulDeshpande/qiskit-waveform-sim"
Repository = "https://github.com/PratulDeshpande/qiskit-waveform-sim"
Documentation = "https://pratuldeshpande.github.io/qiskit-waveform-sim"
Changelog = "https://github.com/PratulDeshpande/qiskit-waveform-sim/blob/main/CHANGELOG.md"
Issues = "https://github.com/PratulDeshpande/qiskit-waveform-sim/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qiskit_waveform_sim*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true