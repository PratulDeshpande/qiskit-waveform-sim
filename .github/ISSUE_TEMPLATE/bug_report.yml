---
name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: qiskit-waveform-sim Version
      description: What version of the package are you using?
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: qiskit-version
    attributes:
      label: Qiskit Version
      description: What version of Qiskit are you using?
      placeholder: "2.5.2"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you using?
      placeholder: "3.11.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running on?
      placeholder: "Ubuntu 22.04 / Windows 11 / macOS 14"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create a circuit...
        2. Compile with...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (error message, stack trace, etc.)
      placeholder: Paste error message or describe actual behavior
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal Reproducible Code
      description: Paste a minimal code snippet that reproduces the issue
      render: python
      placeholder: |
        from qiskit import QuantumCircuit
        from qiskit.providers.fake_provider import GenericBackendV2
        from qiskit_waveform_sim import TargetWaveformSimulator
        ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Additional Logs/Output
      description: Any additional logs, screenshots, or context
      render: text
      placeholder: Paste relevant logs here...
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have provided a minimal reproducible example
          required: true
        - label: I am using the latest version of qiskit-waveform-sim
          required: false