---
name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented
      placeholder: Describe your ideal solution...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered
      placeholder: List alternatives...
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the codebase would this affect?
      options:
        - Core Simulator (TargetWaveformSimulator)
        - Annotations (PulseEnvelopeAnnotation)
        - Visualization (Plotly/Matplotlib)
        - Hardware Export
        - Documentation
        - Tests
        - Examples
        - Packaging/CI
        - Other
    validations:
      required: true
  - type: checkboxes
    id: effort
    attributes:
      label: Implementation Effort
      options:
        - label: Small (few hours, localized change)
        - label: Medium (days, multiple files)
        - label: Large (weeks, architectural change)
        - label: Not sure
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, references, or related issues
      placeholder: Add any other context...
    validations:
      required: false