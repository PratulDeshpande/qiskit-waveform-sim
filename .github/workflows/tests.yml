name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, Qiskit ${{ matrix.qiskit-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        qiskit-version: ["1.0.0", "1.3.0", "2.5.2"]
        include:
          - python-version: "3.11"
            qiskit-version: "1.0.0"
          - python-version: "3.12"
            qiskit-version: "2.5.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "qiskit==${{ matrix.qiskit-version }}"
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest -v tests/ --tb=short -q



  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check qiskit_waveform_sim tests --output-format=github

      - name: Run Black
        run: |
          black --check qiskit_waveform_sim tests

      - name: Run MyPy
        run: |
          mypy qiskit_waveform_sim

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install docs dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx docs
        run: |
          cd docs
          sphinx-build -b html source _build/html -W --keep-going -v

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: docs/_build/html
          retention-days: 7