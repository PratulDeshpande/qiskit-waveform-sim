version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "deps(pip):"
      include: "scope"
    groups:
      qiskit:
        patterns:
          - "qiskit*"
        exclude-patterns:
          - "qiskit-sphinx-theme"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        patterns:
          - "pytest*"
          - "ruff*"
          - "black*"
          - "mypy*"
          - "pre-commit*"
        update-types:
          - "minor"
          - "patch"
      docs-deps:
        patterns:
          - "sphinx*"
          - "nbsphinx*"
          - "myst-parser*"
          - "qiskit-sphinx-theme*"
        update-types:
          - "minor"
          - "patch"
      export-deps:
        patterns:
          - "kaleido*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(github-actions):"